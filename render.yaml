services:
  - type: web
    name: workforceiq-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workforceiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # set to your deployed Vercel URL, e.g. https://your-app.vercel.app
      - key: BOOTSTRAP_SUPERADMIN_EMAIL
        sync: false  # your own platform-owner login — only used once, while the users table is empty
      - key: BOOTSTRAP_SUPERADMIN_PASSWORD
        sync: false
      - key: MCP_SERVER_PORT
        value: "8001"
      - key: MCP_SERVER_URL
        value: http://127.0.0.1:8001/mcp
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: workforceiq-db
    plan: free
    databaseName: workforceiq
    user: workforceiq
